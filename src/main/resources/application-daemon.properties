server.port=20401

spring.datasource.primary.jdbc-url=jdbc:h2:mem:bizdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.primary.driver-class-name=org.h2.Driver
spring.datasource.primary.username=sa
spring.datasource.primary.password=
spring.datasource.primary.hikari.maximum-pool-size=50
spring.datasource.primary.hikari.minimum-idle=10
spring.datasource.primary.hikari.pool-name=HikariPool-PrimaryBiz

spring.datasource.batchmeta.jdbc-url=jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.batchmeta.driver-class-name=org.h2.Driver
spring.datasource.batchmeta.username=sa
spring.datasource.batchmeta.password=
spring.datasource.batchmeta.hikari.maximum-pool-size=50
spring.datasource.batchmeta.hikari.minimum-idle=10
spring.datasource.batchmeta.hikari.pool-name=HikariPool-BatchMeta

